<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calc">
        <div class="bar">
            <span class="title">Calculator</span>
            <div class="tools">
                <button id="copy" class="tool" aria-label="Copy result" title="Copy result">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
                </button>
                <button id="hist-toggle" class="tool" aria-label="Show history" aria-expanded="false" title="History">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                </button>
                <button id="theme" class="tool" aria-label="Toggle light and dark theme" title="Theme">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
                </button>
            </div>
        </div>

        <section class="display" aria-label="Display">
            <div id="expr" class="expr"></div>
            <output id="result" class="result" aria-live="polite">0</output>
        </section>

        <div class="stage">
            <div class="keys">
                <button class="key fn" data-k="AC">AC</button>
                <button class="key fn" data-k="DEL" aria-label="Delete">DEL</button>
                <button class="key fn" data-k="%" aria-label="Percent">%</button>
                <button class="key op" data-k="/" aria-label="Divide">÷</button>

                <button class="key" data-k="7">7</button>
                <button class="key" data-k="8">8</button>
                <button class="key" data-k="9">9</button>
                <button class="key op" data-k="*" aria-label="Multiply">×</button>

                <button class="key" data-k="4">4</button>
                <button class="key" data-k="5">5</button>
                <button class="key" data-k="6">6</button>
                <button class="key op" data-k="-" aria-label="Subtract">−</button>

                <button class="key" data-k="1">1</button>
                <button class="key" data-k="2">2</button>
                <button class="key" data-k="3">3</button>
                <button class="key op" data-k="+" aria-label="Add">+</button>

                <button class="key fn" data-k="(" aria-label="Open bracket">(</button>
                <button class="key" data-k="0">0</button>
                <button class="key fn" data-k=")" aria-label="Close bracket">)</button>
                <button class="key" data-k="." aria-label="Decimal point">.</button>

                <button class="key eq" data-k="=" aria-label="Equals">=</button>
            </div>

            <section id="history" class="history" hidden aria-label="History">
                <div class="h-head">
                    <span>History</span>
                    <button id="h-clear" class="link">Clear</button>
                </div>
                <ul id="h-list"></ul>
            </section>
        </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
</body>
</html>
