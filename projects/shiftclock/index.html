<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ShiftClock</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e1116"><meta name="application-name" content="ShiftClock"><meta name="apple-mobile-web-app-title" content="ShiftClock"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script src="pwa-install.js"></script><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="style.css"></head><body>
<div id="splash"><div class="sp"><img src="icon.svg" alt=""><h1>Shift<i>Clock</i></h1><p>Made by Kedar</p></div></div><script>(function(){var s=document.getElementById("splash"),f=function(){s.classList.add("out");setTimeout(function(){s.remove()},500)};setTimeout(f,1800);s.onclick=f})()</script>
<section id="auth"><div class="ac"><div class="logo"><img class="mark" src="icon.svg" alt="">Shift<i>Clock</i></div><p class="mut">Hours, schedules and pay for every job you work.</p>
<div class="seg"><button id="t-in" class="pri">Log in</button><button id="t-up">Create account</button></div>
<div class="card"><label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div id="cpw" hidden><label>Confirm password</label><input id="cp" type="password" autocomplete="new-password"></div><p id="msg" class="err"></p><button id="go" class="pri big">Log in</button><button id="fg" class="link">Forgot password?</button><button class="link" data-install>Install the app on this device</button></div><p class="mut by">Made by Kedar</p></div></section><section id="verify" hidden><div class="ac"><div class="logo"><img class="mark" src="icon.svg" alt="">Shift<i>Clock</i></div><div class="card vc"><h2>Verify your email</h2><p class="mut">We sent a link to <b id="vem"></b>. Open it, then come back and tap below. Check spam too. Fake or mistyped emails cannot get in.</p><p id="vmsg" class="err"></p><button id="vchk" class="pri big">I have verified</button><button id="vre" class="link">Resend email</button><button id="vout" class="link">Use a different email</button></div></div></section>
<section id="app" hidden><header class="top"><div class="logo" data-a="dash" style="cursor:pointer"><img class="mark" src="icon.svg" alt="">Shift<i>Clock</i></div><button id="av" class="av" data-a="vw" data-i="acct" aria-label="Account"></button></header><div id="tools" hidden><div><span id="who" class="mut"></span><button id="bell" class="sm"></button><button id="inst" class="sm" data-install>Install app</button><button id="so" class="sm">Sign out</button></div></div><nav id="bn"></nav><main id="main"></main></section>
<dialog id="dlg"></dialog><script>if(location.protocol==="file:")addEventListener("DOMContentLoaded",()=>{document.getElementById("msg").textContent="Open this through a web server (see README). Opening the file directly will not work."})</script><script type="module" src="app.js"></script></body></html>
