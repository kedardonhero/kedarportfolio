<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ShiftClock</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e1116"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="style.css"></head><body>
<section id="auth"><div class="ac"><div class="logo"><img class="mark" src="icon.svg" alt="">Shift<i>Clock</i></div><p class="mut">Hours, schedules and pay for every job you work.</p>
<div class="seg"><button id="t-in" class="pri">Log in</button><button id="t-up">Create account</button></div>
<div class="card"><label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><p id="msg" class="err"></p><button id="go" class="pri big">Log in</button><button id="fg" class="link">Forgot password?</button></div></div></section>
<section id="app" hidden><header class="top"><div class="logo" data-a="dash" style="cursor:pointer"><img class="mark" src="icon.svg" alt="">Shift<i>Clock</i></div><button id="av" class="av" data-a="vw" data-i="acct" aria-label="Account"></button></header><div id="tools" hidden><div><span id="who" class="mut"></span><button id="bell" class="sm"></button><button id="inst" class="sm" hidden>Install app</button><button id="so" class="sm">Sign out</button></div></div><nav id="bn"></nav><main id="main"></main></section>
<dialog id="dlg"></dialog><script>if(location.protocol==="file:")addEventListener("DOMContentLoaded",()=>{document.getElementById("msg").textContent="Open this through a web server (see README). Opening the file directly will not work."})</script><script type="module" src="app.js"></script></body></html>
